[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creativity-lab"
version = "0.1.0"
description = "可复现实验台：检验多样性机制在开放任务上是否真的有效"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
creativity-lab = "creativity_lab.cli:main"

[tool.setuptools.packages.find]
include = ["creativity_lab*"]
