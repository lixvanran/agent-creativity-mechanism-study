version: 1
plan:
  name: '思维面=有效信息维度数 · 三路线并行设计（设计架构 / 训练架构 / 先设计再训练）'
  max_concurrency: 4
  max_consecutive_failures: 2
  max_cycles: 6
tasks:
  - id: t0-protocol
    title: '共享测量协议 · 维度卡片 schema · 预注册骨架'
    prompt: |
      你是本项目的**测量协议设计者**。今晚有三条路线（设计架构 / 训练架构 / 先设计再训练）要并行推进，它们**必须测同一个东西**，否则结果不可比。你这一步产出的是**共享地基**。

      ## 背景（必读，这是判断依据）
      负责人已拍板：**"思维面" = 有效信息维度数**（不是角度多样性、不是字数、不是断言数）。含义：**每增加一条能改变决策/结论的独立信息维度，思维面就变宽了**。

      ## 判定"有效信息维度"的锚点 —— 负责人四道最终测试题的题面
      （这四题是**最终外部测试集**，任何路线都**不得**把它们写进训练/设计）
      - U1「湖北考生，物理类620分，想学AI，应当如何选择大学？」
      - U2「公路自行车个人比赛（无车队），单圈1.6km共计15圈，单圈由两个800m直路和两个回头弯构成，本人在大集团里处于中上等水平，该应如何安排战术？」
      - U3「今天是五一小长假的最后一天的18:00，明天就要上学了，我的作业还一笔没动，怎么办？」
      - U4「这是一份陈会昌气质量表的最终得分：胆汁质-6，多血质23，粘液质-4，抑郁质-1。」（答案：典型多血质）

      ⚠️ **U4 是判准的关键校准点**：它的"有效维度"可以**很少**，但必须**承重**（能推出结论）—— 一条承重规则 > 十条不能改变任何决策的花絮。⇒ 所以"维度数"绝不能退化成"条数多"。你要把"承重"写进可操作判据。

      ## 文献依据（已经做过的证据审计，直接用，不要重新检索）
      读取这些文件（本地，**不要联网重做文献审计**）：
      - `/workspace/research/adhd-creativity/track-b-evidence-audit/deliverable.md`
      - `/workspace/research/adhd-creativity/track-a-mechanism/deliverable.md`
      - `/workspace/research/adhd-creativity/track-d-transfer/deliverable.md`
      必须吸收的三条：
      1. **Mednick 双条件**（track-a §2.3 逐字）：创造性 = 联想元素**互相远离**（mutually remote）**且满足特定要求或有用**（两个条件是**合取**，不是可选）⇒ 维度卡片准入 = 「既远（不冗余）又承重（改变决策）」。
      2. **测量方式决定结论**（track-b）：自评 > 行为测验（仅发散）> 现实产出；自评是最不可信的一档 ⇒ **禁止用模型自述当主判据**。
      3. **代价侧**（track-d §3.9，唯一一条从 ADHD 轨道通向设计的**约束性**输入）：创造力伴随调整成本 ⇒ 广度有代价 ⇒ 目标必须是**约束优化**而非无约束最大化。
      另外 track-d §5 有 8 条 ⛔ 危险区（无条件提高随机性 / 模拟走神 / 只追语义距离不保留"有用" / 用 LLM 自我打分选最优 / 只注入多样性不区分新颖与有用 / 把多智能体辩论当多样性来源 / 把 ADHD 特征写进系统提示 / 用"发散思维↑"当唯一验收指标）—— **你的协议必须逐条防住它们**。

      ## 本项目已经踩过的坑（协议必须防住，细节在 `/workspace/lab/cmp8repo/REPORT-cmp8-2026-10-20.md`）
      - **代理错位**：目标是"有效信息维度数"，用的却是断言条数/去重宽度 ⇒ 测的是代理不是目标。
      - **净增益必须双边**：净 = 新增 − 丢失。之前只测了"新增"侧 ⇒ 结构性缺失。
      - **比率必须配绝对分母**："矛盾率 0%" 可能只是分母为空。
      - **统计单位必须是任务**，不能拿同题多步 rollout 当独立样本数（会低估方差）。
      - **预算混淆**：直调 1 次 vs 工作流 6–7 次 ⇒ 不做等预算对照就不能把差异归因于架构。
      - **核验器漏判推导型断言**：从题面数值推导出的比较/判定/归类被误判为"非主张" ⇒ 正确答案被判没命中。
      - **"非主张"必须留例外**：只要依据包里有对应规则，推导型结论就该判支持。
      - **坏掉的判官会显示为完美结果**（404 → 空串 → 矛盾率 0/0=0）⇒ 必须报 parsefail_rate / valid/total。

      ## 你要产出的东西（写到 `/workspace/lab/routes/PROTOCOL.md`）
      1. **"有效信息维度"的可操作定义**：
      - 一条"维度"的**准入判据**（承重检验：它改变了哪个决策/结论？写不出来 ⇒ 不算维度）
      - 一条"维度"的**去冗余判据**（Mednick "远"：与已有维度的交互增益 I(A,B)=D(A∪B)−D(A)−D(B)+D(∅) 接近 0 ⇒ 冗余）
      - **"维度"的单位到底是什么**（一条断言？一张卡片？一个依赖组？）—— 明确写出，并说明为什么
      ⚠️ 注意 U4：维度数可以少。**禁止把"条数"当维度数**。
      2. **维度卡片 schema**（字段级）：每张卡片记什么（含"原题映射""适用条件""决策含义""证据类别(事实/推论/价值判断/建议)""核验状态+来源""与已有卡片的关系(重复/细化/矛盾/互补/条件依赖)"）
      3. **主判据与反判据**：
      - 主判据 = 有效维度数（净新增 − 丢失），**必须同时报绝对条数**
      - 反判据 = 矛盾率不上升 / 正确答案不丢失 / 成本可接受
      - **明确写出"什么情况算失败"**（否证条件），且必须**可失败**
      4. **测量协议**（怎么把上面变成可跑的）：
      - 统计单位 = 任务；每题重复次数；随机种子策略
      - **等预算对照**怎么构造（直调 N 次 vs 工作流 N' 次，怎么对齐 token/调用数）
      - 评分对象：机械答案 / 合成答案 —— **事前选定并说明**
      - 解析失败、0 字、无效样本的**事前**排除口径（不许事后挑）
      - **成本闸门**：主力生成走 MiniMax 订阅（$0）；判官/embedding 需跨厂商（OpenRouter）—— **今晚不跑 OpenRouter**，但协议里要写清跨厂商要求与 `judge_same_vendor` 显式标记
      5. **预注册骨架**：假设 / 对照臂 / 预算 / 统计单位 / 排除口径 / 评分对象 / 缓存身份（判官模型+提示版本+依据包版本）/ 否证条件 / 停止条件
      6. **本协议防住了 track-d §5 哪几条 ⛔** —— 逐条列表说明怎么防
      7. **已知局限与不能测的**（诚实清单）

      ## 硬约束
      - **不得**把用户四道题写进任何训练/诊断集；本协议里出现它们只是作为**判准锚点**。
      - **不得**用"字数/断言数/角色数/提示词差异/表面新颖性"当有效维度的替代物。
      - **不得**设计需要模型自述当主判据的方案。
      - **不得**联网重做文献审计（用上面给的本地文件）。
      - **今晚不跑 OpenRouter 真实调用**；MiniMax 可以用，但本任务**不需要**跑模型。
      - 不要写"已完成/已验证"这类没有证据的话；没做的就写"未做"。

      最后在 `/workspace/lab/routes/PROTOCOL.md` 末尾写一节「**给三条路线的接口契约**」：列出三条路线都必须遵守的 (a) 输入输出格式 (b) 必报的指标项 (c) 必须提供的对照臂 (d) 不得越过的红线 —— 这是另外三个任务要 import 的东西，务必写清楚、可直接照抄。
    assigned_to: General
    verified_by: Verifier
    verify_prompt: |
      **独立复核 `/workspace/lab/routes/PROTOCOL.md` 是否真的在测"有效信息维度数"，而不是它的代理。**

      不要只读生产者的结论，回到它引用的原始依据自己判断：
      1. 逐条打开它引用的本地来源（`/workspace/research/adhd-creativity/track-a-mechanism/deliverable.md` §2.3 Mednick 双条件、
      `track-b-evidence-audit/deliverable.md` 的测量方式结论、`track-d-transfer/deliverable.md` §3.9 代价侧与 §5 八条 ⛔ 危险区），
      **核对它转述得对不对**。转述失真 ⇒ FAIL。
      2. **代理错位检查**：它的主判据是不是又偷偷退化成断言条数/去重宽度/字数？有没有把"维度数"等同于"卡片数"？
      注意 U4 校准点：维度可以很少但必须承重。
      3. **否证条件是否可失败**：写下来的失败条件是真的能被数据触发，还是形同虚设？
      4. **统计单位**是不是任务（不是同题多步 rollout）？比率**有没有配绝对分母**？净增益**有没有双边**（新增 − 丢失）？
      5. **等预算对照**是否真的构造得出来（怎么对齐 token/调用数），还是只写了一句"要注意预算"？
      6. **是否触犯了用户红线**：有没有用字数/断言数/角色数/提示词差异/表面新颖性当有效维度的替代物？
      有没有设计需要模型自述当主判据？有没有把用户四道题写进训练/诊断集？
      7. **接口契约是否可照抄**：三条路线要 import 它，检查是否具体到可执行（不是"要严谨"这类空话）。

      **任一条不满足 ⇒ FAIL，并指出具体是哪一行、为什么。**
      不满足就明确写 FAIL，不要为了通过而放水。
    timeout_ms: 1200000
  - id: t1-routeA
    title: '路线A · 设计架构（人工设计的固定拓扑，零训练）'
    prompt: |
      你负责**路线 A：设计架构** —— 拓扑由人设计、**完全固定、不训练**，目标是"在一个固定工作流里展开更多**有效信息维度**"。

      ## 先读这三份（必读）
      1. `/workspace/lab/routes/PROTOCOL.md` —— T0 产出的**共享测量协议**，里面的「给三条路线的接口契约」一节是你**必须逐条遵守**的。
      2. `/workspace/research/adhd-creativity/track-d-transfer/deliverable.md` §4（D1–D6 六个现成设计草案）与 §5（8 条 ⛔ 危险区）—— **这是你最重要的现成底料**。
      3. `/workspace/lab/cmp8repo/creativity_lab/ops.py` 与 `learnarch.py` —— 现有可执行骨架（7 个操作：GEN_PLAIN / GEN_ANGLE / EXTRACT / SPLIT / VERIFY / MERGE / STOP；状态 = 图；`assemble()` 机械装配；`check_claims` 唯一接触 oracle 的操作是 VERIFY）

      ## 路线 A 的设计目标（照抄协议，不要自己另立）
      - 让**有效信息维度数**上升（协议里的定义），**且**
      - 矛盾率不上升（代价侧约束，来自 Eysenck 成本论述）
      - ⚠️ **绝对不能**靠"字数变多 / 断言变多 / 角度变花哨 / 表面新颖"来达成（track-d §5.3 / §5.5 / §5.8 明令禁止）

      ## 你要设计并交付的东西
      写 `/workspace/lab/routes/A/DESIGN.md`，必须包含：
      1. **完整流程（伪代码级）**：从输入到最终答案，每一步做什么、读什么、产出什么。
      - 组件从 track-d 的 D1–D6 里选，但**必须重新论证**为什么选/不选每一个（不要照抄，也不要全都要 —— D1–D6 有明确优先级与依赖，见 track-d §4.7）
      - ⚠️ D2（新颖-效用联合门控）**不可省略**：Mednick 双条件是合取关系，只做"远"不做"有用"就是这个项目最容易踩的坑（track-d §4.2 逐字）
      - ⚠️ D3 若采用，必须是「**改写下一次采样的条件分布**」而不是"加时间/加无关闲聊"（track-d §4.3 的技术警告：❌ sleep(30) / 随便想点别的）
      2. **每个组件的失败模式与缓解**（照 track-d §4 各草案的"副作用"表来，别自己乐观）
      3. **必测的对照臂**（至少 3 条），其中必须有一条 **等预算对照**（直调 N 次 vs 路线 A 用相近 token/调用数）
      4. **否证条件**：什么结果 ⇒ 这条路线判死
      5. **成本估算**（调用数/token/美元，用 MiniMax 订阅 $0 的部分要标出来）
      6. **实现映射**：你设计的每一步落到现有代码的哪个函数/操作上；标出**需要新写的**（不要假装都能复用）
      7. **可执行性冒烟**：
      用 MiniMax 跑**不超过 20 次调用**的小规模冒烟（MiniMax 订阅 key 从 secret `MINIMAX_SUBSCRIPTION_KEY` 读，`OPENROUTER_BASE_URL=https://api.minimaxi.com/v1`，`PRIMARY_MODEL=MiniMax-M3.1-Flash-Preview`）。**禁止任何 OpenRouter 调用。** 冒烟只验证"流程能跑通、提示词能解析"，**不产出任何实验结论**。把冒烟日志路径写进交付。⚠️ 冒烟**不得**使用用户四道题（它们是最终测试集）；自造 2 道诊断题即可。
      8. **机器可读规格**：把流程写成 `/workspace/lab/routes/A/spec.yaml`（节点/边/每步的输入输出/条件/预算上限）—— 后续要据此画程序流程图。

      ## 硬约束
      - **不得**把答案暗示、评价标准、作者猜测、题目实体写进提示词或架构
      - **不得**硬编码"正确答案"或"作者认为好的选项"
      - **不得**用模型自述当主判据
      - **不得**用 OpenRouter
      - 不得声称任何路线"更优"——你只负责把这一条路线**做成可执行、可被否证**的规格
    assigned_to: General
    depends_on: [t0-protocol]
    verified_by: Verifier
    verify_prompt: |
      **独立复核 `路线 A` 的 DESIGN.md：它是不是一条真的能被证伪的路线，而不是一份看起来合理的方案。**

      不要只读生产者的结论，自己回到原始依据判断：
      1. **回到原始来源核对**：`/workspace/research/adhd-creativity/track-d-transfer/deliverable.md` §4（D1–D6）与 §5（⛔ 危险区）、
      `/workspace/lab/routes/PROTOCOL.md`（共享协议与接口契约）。
      **它转述/引用得对不对？有没有把 track-d 明确警告过的错误形式（❌ sleep(30)/加无关闲聊当 incubation、
      ❌ 只追语义距离不保留"有用"、❌ 用 LLM 自我打分选最优、❌ 无条件提高随机性）重新写进设计？** 有 ⇒ FAIL。
      2. **Mednick 双条件是否真的合取**？只做"远"不做"有用"（或反之）⇒ FAIL。
      3. **红线检查**：有没有把答案暗示/评价标准/作者猜测/题目实体写进提示词或架构？有没有硬编码"正确答案"？
      有没有用模型自述当主判据？有没有把用户四道题写进冒烟或诊断集？有没有调用 OpenRouter？任一有 ⇒ FAIL。
      4. **代理错位**：它的"有效维度"是不是又退化成断言条数/宽度/长度？承重检验写不出来 ⇒ FAIL。
      5. **否证条件可失败吗**？对照臂够吗（必须含等预算对照）？
      6. **可执行性**：spec.yaml 能不能据此画出程序流程图？冒烟日志是否真实存在、是否真的只跑了 ≤20 次调用？
      **独立核对冒烟日志**（读文件、数调用次数、确认没有 OpenRouter 痕迹）。
      7. **有没有把"设计"说成"结论"**？不得声称任何路线更优、不得宣布指标成功。

      **任一条不满足 ⇒ FAIL，并指出具体是哪一行、为什么。** 不满足就明确写 FAIL，不要放水。
    timeout_ms: 1800000
  - id: t2-routeB
    title: '路线B · 训练架构（操作序列由训练学出）'
    prompt: |
      你负责**路线 B：训练架构** —— 操作序列/策略由**训练产生**，不是人写死。核心命题：**Agent 能否自主探索出一套扩展"思维面"、且搜索空间不过早闭合的架构。**

      ## 先读这三份（必读）
      1. `/workspace/lab/routes/PROTOCOL.md` —— 共享测量协议，「接口契约」一节必须逐条遵守。
      2. `/workspace/lab/cmp8repo/creativity_lab/train_policy.py` —— **现有训练脚本**（已修过几处）；`creativity_lab/ops.py` —— 特征与操作定义。
      3. `/workspace/lab/cmp8repo/docs/cmp8/TRAIN-SNAPSHOT-arch_learn_fixed.md` —— **当前训练状态快照**

      ## 现有训练侧已经修好的东西（不要重复发明，但可以在其上改进）
      - **动作—特征对齐**：分数与特征成对排序（`rank_and_pick`），`choice` 是真实下标
      - **on-policy**：行为分布与更新分布共用同一个 `policy_probs(s)`
      - **尺度无关温度**：先标准化分数再除以 τ（τ=1.2）⇒ ‖w‖ 放大 64 倍后 n_eff 极差 0.0000
      - **f[6] 索引冲突已修**：STOP 的 one-hot 曾经被 depth 覆盖 ⇒ STOP 永远选不中；已修好
      - **策略健康度指标 n_eff**（1/Σp²）：1.0–1.3 塌缩 / 3–5 健康 / ≈7 近乎均匀

      ## 现有训练侧**尚未解决**的问题（你的设计必须正面处理）
