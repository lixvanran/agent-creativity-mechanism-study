  - {path: "/workspace/lab/routes/B/code/evidence_index.py", role: "编号化依据包 + 带条目归因的判官（协议 §4.6 逐字）+ 代理 Ŵ"}
  - {path: "/workspace/lab/routes/B/code/monitor.py", role: "监控面板 + τ 控制器 + 告警变异自测"}
  - {path: "/workspace/lab/routes/B/code/train_policy_v2.py", role: "训练循环（on-policy + EMA + 早停 + 校准闸门）+ 精确策略梯度 + 步级奖励去重"}
  - {path: "/workspace/lab/routes/B/code/stub_llm.py", role: "离线 stub 模型（0 次真实调用；只为证明训练循环可执行）"}
  - {path: "/workspace/lab/routes/B/code/guard.py", role: "U1–U4 黑名单自检（命中即 abort）"}
  - {path: "/workspace/lab/routes/B/code/smoke.py", role: "冒烟脚本（阶梯模式开关 + 黑名单前置 abort + 硬上限 20）"}
  - {path: "/workspace/lab/routes/B/code/test_v2_witness.py", role: "见证回归断言（含 --mutate 变异注入自测）"}
  - {path: "/workspace/lab/routes/B/code/test_train_loop.py", role: "训练循环离线自测（0 次真实调用）"}
  - {path: "/workspace/lab/routes/B/code/test_policy_grad.py", role: "策略梯度对拍（精确式 vs 数值梯度；并量化旧解析式的偏差）"}
  - {path: "/workspace/lab/routes/B/code/test_step_reward_dedup.py", role: "步级奖励去重探针（A/B/C/D 四情形）"}
  - {path: "/workspace/lab/routes/B/code/test_judge_parser.py", role: "判官解析器行为表（接受什么/丢什么/已知弱点）"}
  - {path: "/workspace/lab/routes/B/code/test_judge_prompt.py", role: "判官提示词自查（协议 §4.6:522-526 逐字 + C_t 非空）"}
  - {path: "/workspace/lab/routes/B/code/test_spec_flowchart.py", role: "spec 可渲染性自检（双解析 + 渲染非空 + 变异注入）"}
  - {path: "/workspace/lab/routes/B/code/yaml_lite.py", role: "YAML 解析校验器（证明本 spec.yaml 可被机器解析）"}
  - {path: "/workspace/lab/routes/B/code/data/diag_topics.json", role: "2 道自造诊断题"}
untouched:
  - "/workspace/lab/cmp8repo/creativity_lab/** （在跑的训练进程依赖；check_ops_consistency.py 要求两份 ops.py 逐字节一致）"
