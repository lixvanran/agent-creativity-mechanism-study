<h1>路线 A · 固定拓扑（人设计，零训练）</h1>
<p>8 个节点写死。<b>依据包只进核验侧</b>，生成侧只看到题面。
N4 的 prompt 里带「已覆盖清单」⇒ <b>改写的是下一次采样的条件分布</b>（不是 sleep、不是闲聊）。</p>
