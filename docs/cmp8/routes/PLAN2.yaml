version: 1
plan:
  name: '思维面=有效信息维度数 · 三路线并行设计（共享测量协议已定稿）'
  max_concurrency: 4
  max_consecutive_failures: 2
  max_cycles: 6
tasks:
  - id: t1-routeA
    title: '路线A · 设计架构（人工设计的固定拓扑，零训练）'
    prompt: |
      ⚠️ **前置已就绪**：`/workspace/lab/routes/PROTOCOL.md`（约 74 KB / 825+ 行）是**共享测量协议的定稿版**，
      已经过独立对抗性复核并通过（第 1 轮复核提的 9 条全部修掉：测试集答案泄漏进判官提示词的污染链、
      不实自述、出处指错、噪声地板门槛自相矛盾、C2 双计、端点未填、跨臂族匹配未定义等）。
      ⇒ **你直接读它、照它的「接口契约」执行**，不要重写、不要另立口径。

      你负责**路线 A：设计架构** —— 拓扑由人设计、**完全固定、不训练**，目标是"在一个固定工作流里展开更多**有效信息维度**"。

      ## 先读这三份（必读）
      1. `/workspace/lab/routes/PROTOCOL.md` —— T0 产出的**共享测量协议**，里面的「给三条路线的接口契约」一节是你**必须逐条遵守**的。
      2. `/workspace/research/adhd-creativity/track-d-transfer/deliverable.md` §4（D1–D6 六个现成设计草案）与 §5（8 条 ⛔ 危险区）—— **这是你最重要的现成底料**。
      3. `/workspace/lab/cmp8repo/creativity_lab/ops.py` 与 `learnarch.py` —— 现有可执行骨架（7 个操作：GEN_PLAIN / GEN_ANGLE / EXTRACT / SPLIT / VERIFY / MERGE / STOP；状态 = 图；`assemble()` 机械装配；`check_claims` 唯一接触 oracle 的操作是 VERIFY）

      ## 路线 A 的设计目标（照抄协议，不要自己另立）
      - 让**有效信息维度数**上升（协议里的定义），**且**
      - 矛盾率不上升（代价侧约束，来自 Eysenck 成本论述）
      - ⚠️ **绝对不能**靠"字数变多 / 断言变多 / 角度变花哨 / 表面新颖"来达成（track-d §5.3 / §5.5 / §5.8 明令禁止）

      ## 你要设计并交付的东西
      写 `/workspace/lab/routes/A/DESIGN.md`，必须包含：
      1. **完整流程（伪代码级）**：从输入到最终答案，每一步做什么、读什么、产出什么。
      - 组件从 track-d 的 D1–D6 里选，但**必须重新论证**为什么选/不选每一个（不要照抄，也不要全都要 —— D1–D6 有明确优先级与依赖，见 track-d §4.7）
      - ⚠️ D2（新颖-效用联合门控）**不可省略**：Mednick 双条件是合取关系，只做"远"不做"有用"就是这个项目最容易踩的坑（track-d §4.2 逐字）
      - ⚠️ D3 若采用，必须是「**改写下一次采样的条件分布**」而不是"加时间/加无关闲聊"（track-d §4.3 的技术警告：❌ sleep(30) / 随便想点别的）
      2. **每个组件的失败模式与缓解**（照 track-d §4 各草案的"副作用"表来，别自己乐观）
      3. **必测的对照臂**（至少 3 条），其中必须有一条 **等预算对照**（直调 N 次 vs 路线 A 用相近 token/调用数）
      4. **否证条件**：什么结果 ⇒ 这条路线判死
      5. **成本估算**（调用数/token/美元，用 MiniMax 订阅 $0 的部分要标出来）
      6. **实现映射**：你设计的每一步落到现有代码的哪个函数/操作上；标出**需要新写的**（不要假装都能复用）
      7. **可执行性冒烟**：
      用 MiniMax 跑**不超过 20 次调用**的小规模冒烟（MiniMax 订阅 key 从 secret `MINIMAX_SUBSCRIPTION_KEY` 读，`OPENROUTER_BASE_URL=https://api.minimaxi.com/v1`，`PRIMARY_MODEL=MiniMax-M3.1-Flash-Preview`）。**禁止任何 OpenRouter 调用。** 冒烟只验证"流程能跑通、提示词能解析"，**不产出任何实验结论**。把冒烟日志路径写进交付。⚠️ 冒烟**不得**使用用户四道题（它们是最终测试集）；自造 2 道诊断题即可。
      8. **机器可读规格**：把流程写成 `/workspace/lab/routes/A/spec.yaml`（节点/边/每步的输入输出/条件/预算上限）—— 后续要据此画程序流程图。

      ## 硬约束
      - **不得**把答案暗示、评价标准、作者猜测、题目实体写进提示词或架构
      - **不得**硬编码"正确答案"或"作者认为好的选项"
      - **不得**用模型自述当主判据
      - **不得**用 OpenRouter
      - 不得声称任何路线"更优"——你只负责把这一条路线**做成可执行、可被否证**的规格
    assigned_to: General
    verified_by: Verifier
    verify_prompt: |
      **独立复核 `路线 A` 的 DESIGN.md：它是不是一条真的能被证伪的路线，而不是一份看起来合理的方案。**

      不要只读生产者的结论，自己回到原始依据判断：
      1. **回到原始来源核对**：`/workspace/research/adhd-creativity/track-d-transfer/deliverable.md` §4（D1–D6）与 §5（⛔ 危险区）、
      `/workspace/lab/routes/PROTOCOL.md`（共享协议与接口契约）。
      **它转述/引用得对不对？有没有把 track-d 明确警告过的错误形式（❌ sleep(30)/加无关闲聊当 incubation、
      ❌ 只追语义距离不保留"有用"、❌ 用 LLM 自我打分选最优、❌ 无条件提高随机性）重新写进设计？** 有 ⇒ FAIL。
      2. **Mednick 双条件是否真的合取**？只做"远"不做"有用"（或反之）⇒ FAIL。
      3. **红线检查**：有没有把答案暗示/评价标准/作者猜测/题目实体写进提示词或架构？有没有硬编码"正确答案"？
      有没有用模型自述当主判据？有没有把用户四道题写进冒烟或诊断集？有没有调用 OpenRouter？任一有 ⇒ FAIL。
      4. **代理错位**：它的"有效维度"是不是又退化成断言条数/宽度/长度？承重检验写不出来 ⇒ FAIL。
      5. **否证条件可失败吗**？对照臂够吗（必须含等预算对照）？
      6. **可执行性**：spec.yaml 能不能据此画出程序流程图？冒烟日志是否真实存在、是否真的只跑了 ≤20 次调用？
      **独立核对冒烟日志**（读文件、数调用次数、确认没有 OpenRouter 痕迹）。
      7. **有没有把"设计"说成"结论"**？不得声称任何路线更优、不得宣布指标成功。

      **任一条不满足 ⇒ FAIL，并指出具体是哪一行、为什么。** 不满足就明确写 FAIL，不要放水。
    timeout_ms: 1800000
  - id: t2-routeB
    title: '路线B · 训练架构（操作序列由训练学出）'
    prompt: |
      你负责**路线 B：训练架构** —— 操作序列/策略由**训练产生**，不是人写死。核心命题：**Agent 能否自主探索出一套扩展"思维面"、且搜索空间不过早闭合的架构。**

      ## 先读这三份（必读）
      1. `/workspace/lab/routes/PROTOCOL.md` —— 共享测量协议，「接口契约」一节必须逐条遵守。
      2. `/workspace/lab/cmp8repo/creativity_lab/train_policy.py` —— **现有训练脚本**（已修过几处）；`creativity_lab/ops.py` —— 特征与操作定义。
      3. `/workspace/lab/cmp8repo/docs/cmp8/TRAIN-SNAPSHOT-arch_learn_fixed.md` —— **当前训练状态快照**

      ## 现有训练侧已经修好的东西（不要重复发明，但可以在其上改进）
      - **动作—特征对齐**：分数与特征成对排序（`rank_and_pick`），`choice` 是真实下标
      - **on-policy**：行为分布与更新分布共用同一个 `policy_probs(s)`
      - **尺度无关温度**：先标准化分数再除以 τ（τ=1.2）⇒ ‖w‖ 放大 64 倍后 n_eff 极差 0.0000
      - **f[6] 索引冲突已修**：STOP 的 one-hot 曾经被 depth 覆盖 ⇒ STOP 永远选不中；已修好
      - **策略健康度指标 n_eff**（1/Σp²）：1.0–1.3 塌缩 / 3–5 健康 / ≈7 近乎均匀

      ## 现有训练侧**尚未解决**的问题（你的设计必须正面处理）
      1. **特征空间缺"信息缺口"维度**：`op_features` 只填 f[7]..f[13]（target 相关），当 target=None 时这些维度全 0 ⇒ **GEN_PLAIN/GEN_ANGLE 在线性评分下同深度分差是常数** ⇒ 策略**无法按信息缺口选择** ⇒ 学到的是"风格"不是"适应"。但改维度会让旧权重作废、必须重跑全部对照。⇒ **你必须给出取舍方案**（例如：14 维保持不变 + 用"全局缺口特征"重定义某维，或升到 17 维并明确"全部对照要重跑"的代价），并**明确写清楚不可比性**。⇒ 实测证据：4 个不同状态（target=None/未提及/支持/矛盾）的 op 分数向量**完全相同**。
      2. **奖励函数当前用的是宽度/约束代理**，不是协议里的"有效信息维度数" ⇒ 你要说明如何让训练目标**贴近**协议主判据，以及在自动测量不可靠时如何不作弊。
      3. **策略塌缩的监控**：训练必须内置 n_eff / 操作分布熵监控，冻结（"进程还活着但什么都没学"）必须能被自动发现。
      4. **探索闭合**（"搜索空间不过早闭合"）目前**没有任何机制**：14 维局部线性策略在单一题集上极易过拟合（实测：训练第 1 名在留出中变第 15 名；Spearman(训练排名, 留出排名)=+0.166）。⇒ 你的设计必须给出**防止过早闭合**的具体机制（搜索空间参数化 / 任务多样性 / 留出纪律 / 正则 / 参数共享策略等），并说明怎么验证它。
      5. **过拟合到题集**：特征与题无关这一点是绕开"在题集上挑赢家"的关键 ⇒ 新设计**不得**引入题目相关特征。

      ## 你要交付的东西
      写 `/workspace/lab/routes/B/DESIGN.md`：
      1. **训练算法**（伪代码级）：动作空间、状态表示、特征定义（含维度取舍与理由）、策略参数化、采样与更新、奖励 shaping、终止判据、预算上限
      2. **奖励函数**：怎么用协议里的"有效信息维度数"做目标；若自动测量不可靠 ⇒ 明确写出**代理**是什么、**代理与目标的差距**、以及**如何交叉校验**
      3. **防过早闭合机制**（至少 2 个候选 + 选哪个 + 理由）
      4. **对照臂**（至少 4 条），必须含：`w=0` 初始策略 / **等预算**多次采样 / 随机策略 / 路线 A 的固定架构（作为人定拓扑的参照）
      5. **否证条件**（可失败）：什么结果 ⇒ "学到了架构"这个说法判死
      6. **训练期监控面板**：n_eff / 操作分布 / 宽度 / 矛盾率 / 留出排名漂移 / **每项的告警阈值**
      7. **成本估算**
      8. **可执行性冒烟**：
      用 MiniMax 跑**不超过 20 次调用**的小规模冒烟（MiniMax 订阅 key 从 secret `MINIMAX_SUBSCRIPTION_KEY` 读，`OPENROUTER_BASE_URL=https://api.minimaxi.com/v1`，`PRIMARY_MODEL=MiniMax-M3.1-Flash-Preview`）。**禁止任何 OpenRouter 调用。** 冒烟只验证"流程能跑通、提示词能解析"，**不产出任何实验结论**。把冒烟日志路径写进交付。⚠️ 冒烟**不得**使用用户四道题（它们是最终测试集）；自造 2 道诊断题即可。
      9. **机器可读规格** → `/workspace/lab/routes/B/spec.yaml`（动作空间/特征维度表/训练超参/奖励项/监控项）

      ## 硬约束
      - **不得**引入题目相关特征；**不得**把答案暗示/评价标准/作者猜测注入提示词或架构
      - **不得**用模型自述当主判据
      - **不得**用 OpenRouter
      - 不得声称"学到了架构"或任何路线更优 —— 你只负责把这条路**做成可执行、可被否证**的规格
    assigned_to: General
    verified_by: Verifier
    verify_prompt: |
      **独立复核 `路线 B` 的 DESIGN.md：它是不是一条真的能被证伪的路线，而不是一份看起来合理的方案。**

      不要只读生产者的结论，自己回到原始依据判断：
      1. **回到原始来源核对**：`/workspace/research/adhd-creativity/track-d-transfer/deliverable.md` §4（D1–D6）与 §5（⛔ 危险区）、
      `/workspace/lab/routes/PROTOCOL.md`（共享协议与接口契约）。
      **它转述/引用得对不对？有没有把 track-d 明确警告过的错误形式（❌ sleep(30)/加无关闲聊当 incubation、
      ❌ 只追语义距离不保留"有用"、❌ 用 LLM 自我打分选最优、❌ 无条件提高随机性）重新写进设计？** 有 ⇒ FAIL。
      2. **Mednick 双条件是否真的合取**？只做"远"不做"有用"（或反之）⇒ FAIL。
      3. **红线检查**：有没有把答案暗示/评价标准/作者猜测/题目实体写进提示词或架构？有没有硬编码"正确答案"？
      有没有用模型自述当主判据？有没有把用户四道题写进冒烟或诊断集？有没有调用 OpenRouter？任一有 ⇒ FAIL。
      4. **代理错位**：它的"有效维度"是不是又退化成断言条数/宽度/长度？承重检验写不出来 ⇒ FAIL。
      5. **否证条件可失败吗**？对照臂够吗（必须含等预算对照）？
      6. **可执行性**：spec.yaml 能不能据此画出程序流程图？冒烟日志是否真实存在、是否真的只跑了 ≤20 次调用？
      **独立核对冒烟日志**（读文件、数调用次数、确认没有 OpenRouter 痕迹）。
      7. **有没有把"设计"说成"结论"**？不得声称任何路线更优、不得宣布指标成功。

      **任一条不满足 ⇒ FAIL，并指出具体是哪一行、为什么。** 不满足就明确写 FAIL，不要放水。
    timeout_ms: 1800000
  - id: t3-routeC
    title: '路线C · 先设计再训练（人定拓扑，训练优化细节参数）'
    prompt: |
      你负责**路线 C：先设计，再通过训练优化细节** —— 这是第三条路，位于 A 与 B 之间：**人（或一个受约束的提案器）先定架构拓扑，训练只优化细节参数**（阈值、预算分配、门控强度、采样温度、重试次数、干预触发条件等）。

      ## 先读这三份（必读）
      1. `/workspace/lab/routes/PROTOCOL.md` —— 共享测量协议，「接口契约」一节必须逐条遵守。
      2. `/workspace/research/adhd-creativity/track-d-transfer/deliverable.md` §4（D1–D6）与 §5（⛔ 危险区）
      3. `/workspace/lab/cmp8repo/creativity_lab/ops.py`、`learnarch.py`、`train_policy.py`（现有可执行骨架与训练脚本）

      ## 为什么这条路值得单独做（你自己的论证，别照抄）
      A 把所有决策都写死 ⇒ 人的偏见无处收敛、无数据可依；B 把所有决策都交给学 ⇒ 样本极少时必然过拟合、且搜索空间本身可能闭死；C 把**拓扑**（人在先验上定，且要求它有可证伪的结构）与**参数**（由训练在数据上定）分离。⇒ 你要论证的是：**C 能在 A 的稳定性和 B 的自适应性之间拿到更好的平衡**，并且**它比 A/B 更容易被否证**（因为拓扑固定 ⇒ 变量少 ⇒ 归因清楚）。

      ## 一个已有的关键教训（必须吸收）
      本项目做过"Agent 自主提案实验"：**3 轮 5 份提案全部违反矛盾率约束被否**。根因有两点：① 提案者**必须看到行动空间说明书**（否则它提不出可执行的动作）；② **诊断信号不得含 oracle 统计**（否则它会去钻指标的空子）。⇒ 你的设计必须正面处理这两点，并说明 C 的"设计"环节由谁做、**提案者能看到什么、看不到什么**。

      ## 你要交付的东西
      写 `/workspace/lab/routes/C/DESIGN.md`：
      1. **拓扑与参数的分离点**（哪些是拓扑、哪些是参数）—— 逐项列表
      2. **拓扑来源**：人定 / 受约束提案器定 / 混合？给出**具体机制**：提案者的行动空间说明书长什么样、诊断信号里允许出现什么、禁止出现什么
      3. **参数训练**：参数空间怎么定义（连续/离散/类别）、优化目标（**必须**体现协议里的代价侧约束，不许无约束最大化）、训练信号从哪来（不靠模型自述）、怎么防止把参数调成"投机"配置
      4. **"设计"本身的否证条件**：怎么知道"人定拓扑"这一步没在拖后腿？（例如：与 B 的对比能不能分离出"拓扑"这一项的贡献）
      5. **对照臂**（至少 4 条），必须含：A（纯人定参数）/ B（纯学）/ C（人定拓扑+学参数）/ **等预算**基线
      6. **否证条件**（可失败）
      7. **成本估算**
      8. **可执行性冒烟**：
      用 MiniMax 跑**不超过 20 次调用**的小规模冒烟（MiniMax 订阅 key 从 secret `MINIMAX_SUBSCRIPTION_KEY` 读，`OPENROUTER_BASE_URL=https://api.minimaxi.com/v1`，`PRIMARY_MODEL=MiniMax-M3.1-Flash-Preview`）。**禁止任何 OpenRouter 调用。** 冒烟只验证"流程能跑通、提示词能解析"，**不产出任何实验结论**。把冒烟日志路径写进交付。⚠️ 冒烟**不得**使用用户四道题（它们是最终测试集）；自造 2 道诊断题即可。
